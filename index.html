<style>
/* Layout: a video store shelf. Sticky progress dock on top, breakdown grid, then rows with Seen and Own boxes at the right edge. */
:root {
  --bg: #eeedf2;
  --surface: #f8f7fb;
  --ink: #1c1824;
  --muted: #5d5770;
  --line: #d3cfdd;
  --seen: #b3262a;
  --any: var(--ink);
  --vhs: #8a5a00;
  --dvd: #1f5fa8;
  --dig: #1d7a4b;
  --font-display: "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121018;
    --surface: #1b1722;
    --ink: #ece8f3;
    --muted: #9d96ad;
    --line: #2f2a3b;
    --seen: #e5484d;
    --vhs: #e9b13c;
    --dvd: #5aa2f0;
    --dig: #4cc38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121018;
  --surface: #1b1722;
  --ink: #ece8f3;
  --muted: #9d96ad;
  --line: #2f2a3b;
  --seen: #e5484d;
  --vhs: #e9b13c;
  --dvd: #5aa2f0;
  --dig: #4cc38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 64px;
}
.wrap { --cw: 3.4rem; max-width: 56rem; margin-inline: auto; }
.hero { padding-block: 40px 20px; }
.kicker {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 10px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  line-height: 1.02;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
.lede { color: var(--muted); max-width: 40rem; margin: 12px 0 0; }

/* Progress dock */
.dock {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.dock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.meter { min-width: 0; }
.m-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.m-label {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.m-pct {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.meter.seen .m-pct, .meter.seen .m-label { color: var(--seen); }
.meter.own .m-pct, .meter.own .m-label { color: var(--any); }
.bar { height: 8px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; transition: width 0.25s ease; }
.seen .bar i { background: var(--seen); }
.own .bar i { background: var(--any); }
.m-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.status { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 10px 0 0; min-height: 1em; }

/* Format meters */
.fmts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.fm { min-width: 0; }
.fm-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.fm-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.fm-pct { font-family: var(--font-mono); font-weight: 500; font-size: 1rem; font-variant-numeric: tabular-nums; }
.fm .bar { height: 4px; margin-top: 4px; }
.fm-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.fm.vhs .fm-label, .fm.vhs .fm-pct { color: var(--vhs); }
.fm.vhs .bar i { background: var(--vhs); }
.fm.dvd .fm-label, .fm.dvd .fm-pct { color: var(--dvd); }
.fm.dvd .bar i { background: var(--dvd); }
.fm.dig .fm-label, .fm.dig .fm-pct { color: var(--dig); }
.fm.dig .bar i { background: var(--dig); }

/* Breakdown */
.breakdown { padding-block: 20px 8px; }
.breakdown h2, .sec h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.25rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
}
.bd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 10px; margin-top: 12px; }
.bd {
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  min-width: 0;
}
.bd:hover { border-color: var(--muted); }
.bd:focus-visible, .chip:focus-visible, .search:focus-visible, .chk input:focus-visible { outline: 2px solid var(--seen); outline-offset: 2px; }
.bd-name { font-weight: 600; font-size: 14px; display: block; }
.bd-bars { display: grid; gap: 4px; margin-top: 8px; }
.bd-bars .bar { height: 5px; margin-top: 0; }
.bd-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 6px; display: block; font-variant-numeric: tabular-nums; }

/* Tools */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 16px 8px; }
.search {
  flex: 1 1 14rem;
  min-width: 0;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sections and rows */
.sec { margin-top: 28px; }
.sec-head {
  display: grid;
  grid-template-columns: 1fr var(--cw);
  align-items: end;
  gap: 4px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
}
.sec-head .sec-count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: block; margin-top: 2px; font-variant-numeric: tabular-nums; }
.colh { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; color: var(--muted); }
.colh.s { color: var(--seen); }
.colh.v { color: var(--vhs); }
.colh.d { color: var(--dvd); }
.colh.g { color: var(--dig); }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: 3rem 1fr var(--cw);
  align-items: center;
  gap: 4px;
  padding-block: 8px;
  border-bottom: 1px solid var(--line);
}
.row .yr { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .ttl { min-width: 0; }
.row .ttl b { font-weight: 500; display: block; overflow-wrap: anywhere; }
.row .ttl i { font-style: normal; font-size: 13px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.row.is-seen .ttl b { color: var(--muted); }
.chk { display: flex; justify-content: center; }
.chk input { width: 22px; height: 22px; margin: 0; cursor: pointer; }
.dash { font: inherit; font-family: var(--font-mono); font-size: 14px; color: var(--muted); background: none; border: 0; border-radius: 4px; width: 22px; height: 22px; padding: 0; cursor: pointer; text-align: center; line-height: 1; }
.dash:hover { color: var(--ink); background: var(--line); }
.dash:focus-visible { outline: 2px solid var(--seen); outline-offset: 2px; }
.chk.have { color: var(--dvd); font-weight: 700; font-size: 18px; }
.chk.none { color: var(--line); font-size: 18px; }
.chk.na { color: var(--line); font-family: var(--font-mono); font-size: 14px; cursor: default; }
.chk.seen input { accent-color: var(--seen); }
.chk.vhs input { accent-color: var(--vhs); }
.chk.dvd input { accent-color: var(--dvd); }
.chk.dig input { accent-color: var(--dig); }
.group {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-block: 16px 6px;
  border-bottom: 1px solid var(--line);
}
.group span:first-child { font-family: var(--font-display); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
.group span:last-child { font-family: var(--font-mono); font-size: 11px; color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding-block: 24px; }

@media (max-width: 520px) {
  .wrap { --cw: 2.7rem; }
  .dock-grid { gap: 14px; }
  .fmts { gap: 10px; }
  .fm-sub { display: none; }
  .row { grid-template-columns: 2.2rem 1fr var(--cw); }
  .colh { font-size: 9.5px; letter-spacing: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</div>

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

  // Build the item list and the section structure.
  var items = [];
  var sections = [];

  function addSeries(sec, list, prefix) {
    list.forEach(function (f) {
      var g = { name: f[0], items: [] };
      f[1].split("\n").forEach(function (line) {
        var p = line.split("|");
        var it = { id: slug(prefix + " " + f[0] + " " + p[0] + " " + p[1]), year: +p[0], title: p[1], note: p[2] || "", group: f[0], sec: sec };
        g.items.push(it); items.push(it);
      });
      sec.groups.push(g);
    });
    sections.push(sec);
  }
  addSeries({ key: "fr", title: "Franchises", blurb: "Series entries in release order, through today", groups: [] }, FRANCHISES, "fr");
  addSeries({ key: "more", title: "More series", blurb: "Series that grew out of 80s and 90s films, through today", groups: [] }, MORE, "more");

  STANDALONE.forEach(function (s) {
    var sec = { key: s.key, title: s.title, blurb: "", groups: [{ name: "", items: [] }] };
    s.lines.split("\n").forEach(function (line) {
      var p = line.split("|");
      var it = { id: slug(s.key + " " + p[0] + " " + p[1]), year: +p[0], title: p[1], note: p[2] || "", group: "", sec: sec };
      sec.groups[0].items.push(it); items.push(it);
    });
    sections.push(sec);
  });


  // State

  function $(id) { return document.getElementById(id); }
  function pct(n, d) { return d ? (n * 100 / d).toFixed(1) + "%" : "0.0%"; }
  function setStatus(t) { $("status").textContent = t; }
  function released(it) { return !noDvd[it.id]; }

  var rowEls = {}, secEls = [];

  function build() {
    var list = $("list");
    sections.forEach(function (sec) {
      var s = document.createElement("section"); s.className = "sec"; s.id = "sec-" + sec.key;
      var head = document.createElement("div"); head.className = "sec-head";
      var hl = document.createElement("div");
      var h2 = document.createElement("h2"); h2.textContent = sec.title;
      var cnt = document.createElement("span"); cnt.className = "sec-count";
      hl.appendChild(h2); hl.appendChild(cnt); head.appendChild(hl);
      var c = document.createElement("span"); c.className = "colh d"; c.textContent = "DVD"; head.appendChild(c);
      s.appendChild(head);
      var ol = document.createElement("ol"); ol.className = "rows";
      var secRec = { sec: sec, el: s, cnt: cnt, groups: [] };
      sec.groups.forEach(function (g) {
        var grec = { g: g, header: null, cnt: null };
        if (g.name) {
          var gh = document.createElement("li"); gh.className = "group";
          var a = document.createElement("span"); a.textContent = g.name;
          var b2 = document.createElement("span");
          gh.appendChild(a); gh.appendChild(b2); ol.appendChild(gh);
          grec.header = gh; grec.cnt = b2;
        }
        g.items.forEach(function (it) {
          var li = document.createElement("li"); li.className = "row";
          var yr = document.createElement("span"); yr.className = "yr"; yr.textContent = it.year;
          var ttl = document.createElement("span"); ttl.className = "ttl";
          var b1 = document.createElement("b"); b1.textContent = it.title; ttl.appendChild(b1);
          if (it.note) { var i1 = document.createElement("i"); i1.textContent = it.note; ttl.appendChild(i1); }
          var cell = document.createElement("span"); cell.className = "chk";
          li.appendChild(yr); li.appendChild(ttl); li.appendChild(cell);
          ol.appendChild(li);
          rowEls[it.id] = { li: li, cell: cell };
        });
        secRec.groups.push(grec);

      s.appendChild(ol);
      var empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "No films match that filter in this section."; empty.hidden = true;
      s.appendChild(empty); secRec.empty = empty;
      list.appendChild(s); secEls.push(secRec);
    });
    var grid = $("bdGrid");
    secEls.forEach(function (sr) {
      var btn = document.createElement("button"); btn.type = "button"; btn.className = "bd";
      var nm = document.createElement("span"); nm.className = "bd-name"; nm.textContent = sr.sec.title;
      var bars = document.createElement("span"); bars.className = "bd-bars";
      var m = document.createElement("span"); m.className = "own"; var bb = document.createElement("span"); bb.className = "bar"; var f = document.createElement("i"); bb.appendChild(f); m.appendChild(bb); bars.appendChild(m);

  }

  function matches(it) {
    if (filter === "have" && !have[it.id]) return false;
    if (filter === "missing" && (have[it.id] || !released(it))) return false;
    if (filter === "nodvd" && released(it)) return false;
    if (query && (it.title + " " + it.note + " " + it.group + " " + it.year).toLowerCase().indexOf(query) === -1) return false;

        if (gAny) any = true;

      sr.empty.hidden = any;

  }
  function render() {
    var nRel = 0, nHave = 0;
    items.forEach(function (it) {
      var cell = rowEls[it.id].cell;
      if (!released(it)) { cell.className = "chk none"; cell.textContent = "–"; cell.title = "No DVD released"; }
      else if (have[it.id]) { cell.className = "chk have"; cell.textContent = "✓"; cell.title = "Have on DVD"; nHave++; nRel++; }
      else { cell.className = "chk none"; cell.textContent = "·"; cell.title = "Not owned yet"; nRel++; }

        if (gr.cnt) gr.cnt.textContent = gh + " of " + gr2 + " on DVD";
      });
      sr.cnt.textContent = h + " of " + r + " on DVD";
      sr.bd.f.style.width = (r ? h * 100 / r : 0) + "%";
      sr.bd.ct.textContent = h + " of " + r + " on DVD";
    });
    applyFilter();
  }

  build(); render();
  fetch("ticks.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
